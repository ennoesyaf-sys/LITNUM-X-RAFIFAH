<style>

<script>
const Q=[
{g:"Teks 1 · AI di tempat kerja",t:"tf",q:"Berdasarkan informasi pada teks, sektor industri mana yang banyak terdampak AI? Pilih BENAR atau SALAH untuk tiap pernyataan.",o:["Information and communication","Financial and insurance activities","Agriculture, Forestry and Fisheries"],a:"TTF",r:"Teks tidak menyebut nama sektor secara langsung, jadi kita menyimpulkan (inferensi). Teks menekankan kekuatan AI pada pekerjaan berbasis data: “analyze vast amounts of data quickly” dan “data-driven decisions”. A BENAR: informasi & komunikasi sangat digital dan berbasis data. B BENAR: keuangan & asuransi bergantung pada analisis data dan prakiraan (“more accurate forecasts”). C SALAH: pertanian, kehutanan, dan perikanan bergantung pada kerja fisik di lapangan; teks tidak mendukungnya. Catatan: soal ini bergantung pada penalaran, bukan kalimat eksplisit."},
{g:"Teks 2 · Bali’s Natural Wonders",t:"multi",q:"Which parts of the text best support the description of Bali as “Bali is full of natural beauty”? (pilih semua yang benar)",o:["peaceful area filled with green forests, calm mangrove swamps, and colorful coral reefs along the sea.","These terraces are shaped by generations of farmers who work the land by hand.","Water flows gently over rocky cliffs into a cool, clear pool. Mist rises into the air, mixing with the calming sound of falling water.","In the morning, mist rises above the fields, and sunlight reflects off the water in the paddies.","Farmers in wide-brimmed hats plant rice carefully, their feet sinking into the soft earth."],a:"ACD",r:"Kata kunci: “natural beauty”, jadi cari kalimat yang MENGGAMBARKAN KEINDAHAN ALAM. A: hutan hijau, rawa mangrove, terumbu karang. C: air terjun, kolam jernih, kabut, suara air. D: kabut dan pantulan sinar matahari di sawah. B salah karena terasering “shaped by farmers”, itu hasil karya manusia. E salah karena menggambarkan aktivitas petani, bukan keindahan alam."},
{g:"Teks 3 · Intern at a Sports Club",t:"multi",q:"What are the best words to describe the writer’s personality during the internship? (pilih semua yang benar)",o:["Careful and ready to help","Confident and enjoys working alone","Responsible and willing to learn","Friendly and works well with others","Creative and likes to try new things"],a:"ACD",r:"Cocokkan tiap sifat dengan bukti di teks. A: ia cepat mengambil first aid kit dan membantu pelatih menenangkan pemain (careful, ready to help). C: ia disiplin datang tepat waktu, mengikuti instruksi, dan mau dilatih menangani keadaan darurat (responsible, willing to learn). D: pelatih memuji “teamwork … and communication”. B salah: ia justru bekerja dalam tim dan awalnya gugup, bukan percaya diri bekerja sendiri. E salah: tidak ada bukti ia kreatif atau suka mencoba hal baru."},
{g:"Teks 3 · Intern at a Sports Club",t:"single",q:"During the internship, what did the writer do every morning?",o:["Made schedules and explained them to the coaches.","Played football with the team and got the first aid kit.","Prepared a club gift, guided the coaches, and gave t-shirts.","Woke up early, arrived on time, and followed the instructions.","Set up cones, brought water, and checked emergency schedules."],a:"D",r:"Kalimat kunci di paragraf 2: “Every morning I had to wake up early, arrive on time, and follow instructions carefully.” Kata “every morning” mengarah ke D. E salah: menyiapkan kerucut dan air adalah tugas hari pertama, dan yang diperiksa adalah “training schedules”, bukan “emergency schedules”."},
{g:"Teks 5–9 · Plant nutrients",t:"single",q:"Which of the following elements is not taken up from the soil?",o:["Potassium","Magnesium","Carbon","Calcium","Sulfur"],a:"C",r:"Paragraf 2: “The plant obtains carbon and hydrogen dioxide from the atmosphere; other nutrients are taken up from the soil.” Jadi carbon (karbon) diperoleh dari udara. Potassium, magnesium, calcium, dan sulfur termasuk “other nutrients” yang diserap dari tanah."},
{g:"Teks 5–9 · Plant nutrients",t:"single",q:"Why do farmers prefer considering the only available nutrients to the total quantities of nutrient found in the soil? Because ...",o:["they do to know how to obtain all the nutrients","chemical analyses indicate that the soil constrains all the nutrients needed","the nutrient are in the soil","most of the nutrients are bound in compounds","some of the nutrients are found in the atmosphere"],a:"D",r:"Paragraf 3: “Much of this potential supply … is bound tightly in forms that are not released to crops fast enough.” Artinya sebagian besar nutrisi terikat dalam senyawa sehingga tidak bisa langsung dipakai tanaman. Itulah alasan petani hanya mengukur nutrisi yang tersedia (available). A, B, C tidak sesuai isi teks; E bicara tentang udara, bukan alasan petani."},
{g:"Teks 5–9 · Plant nutrients",t:"single",q:"The topic of paragraph three is about ...",o:["the result of chemical analyses","the requirements of crop plants","giving satisfactory growth to the plants","measuring the available nutrients supply","the abundance of nutrients in the soil."],a:"D",r:"Topik = hal yang dibahas seluruh paragraf. Paragraf 3 membandingkan total nutrisi dengan yang tersedia, lalu ditutup: “the farmer is interested in measuring the available nutrient supply”. Itu inti paragraf. A, B, E hanya bagian dari kalimat-kalimat awal; C hanya detail pendukung."},
{g:"Teks 5–9 · Plant nutrients",t:"single",q:"How many elements which are not very important can be found in the plants?",o:["Three","Five","Seven","Nine","Sixteen"],a:"B",r:"Paragraf 2 menyebut unsur yang ada di tanaman tetapi “not essential”: sodium, iodine, cobalt, silicon, dan aluminum = 5 unsur. Hati-hati dengan jebakan hitungan 16 − 9 = 7: soal menanyakan unsur yang disebut di teks."},
{g:"Teks 5–9 · Plant nutrients",t:"single",q:"“The plant obtains carbon and hydrogen dioxide ...” (paragraph 2). Obtains means ...",o:["Gets","Takes","Puts","Gives","Has"],a:"A",r:"Obtain = memperoleh/mendapatkan = get. Takes berarti mengambil (bisa tanpa makna “memperoleh”), puts dan gives berarti arah sebaliknya, has berarti memiliki (kondisi, bukan proses mendapatkan)."},
{g:"Teks 10–14 · Ecology",t:"single",q:"The habitat of polar bear is in ...",o:["the tropical countries","the North pole","the South pole","the Arctic seas","Europe"],a:"B",r:"Kalimat pertama: “Polar bear are adapted to life in the polar region, around the North Pole.” Jawaban yang disebut langsung sebagai habitat adalah North Pole. “Arctic seas” muncul di paragraf 2 sebagai tempat ikan hidup, jadi itu pengecoh. Tropical, South Pole, dan Europe jelas salah."},
{g:"Teks 10–14 · Ecology",t:"single",q:"What does the text mainly discuss?",o:["ecology","polar bears","cycles in nature","the misuse of pesticides","an ideal ecological system"],a:"A",r:"Teks mendefinisikan ecology, menyebut pelajaran pertamanya, memberi contoh (beruang kutub, siklus nitrogen & oksigen, pestisida), dan ditutup dengan “Through ecology we try to restore the balance”. Pilihan lain hanya contoh atau bagian dari ekologi."},
{g:"Teks 10–14 · Ecology",t:"single",q:"The ecology in certain area will be in danger if ...",o:["seals eat a lot of fish","the farmers use pesticides","polar bears don’t eat seals anymore","man interferes his environment too much","plants take nitrogen compound from the soil"],a:"D",r:"Paragraf 5: “particularly where man interferes, a species may become too successful and abundant, and the balance is destroyed.” Campur tangan manusia yang berlebihan merusak keseimbangan. B terlalu sempit: yang berbahaya adalah pestisida yang digunakan tanpa hati-hati, bukan penggunaan pestisida itu sendiri. E adalah siklus alami yang normal."},
{g:"Teks 10–14 · Ecology",t:"single",q:"The main idea of paragraph 3 is that ...",o:["Polar bears depend on seals","Ecological system needs well treatment","Plants and animals depend one each other","Plants produce and release oxygen to the atmosphere","There’s an interdependence of living things in a particular area."],a:"C",r:"Kalimat utama paragraf 3 ada di awal: “important cycles in nature that show plants and animals depend on each other”. Siklus nitrogen dan oksigen hanyalah contoh. A adalah paragraf 2, D hanya satu contoh, B adalah paragraf 5. E mirip C, tetapi “in a particular area” bukan isi paragraf 3."},
{g:"Teks 10–14 · Ecology",t:"single",q:"“... the world from devastation.” (paragraph 6) The synonym of the underlined word is ...",o:["Rehabilitation","Extinction","Destruction","Preservation","Starvation"],a:"C",r:"Devastation = kehancuran besar = destruction. Rehabilitation (pemulihan) dan preservation (pelestarian) berlawanan arti; extinction berarti kepunahan spesies; starvation berarti kelaparan."},
{g:"Teks 15–19 · Women’s suffrage",t:"single",q:"When were women allowed to vote throughout the United States?",o:["In 1865","After 1868","After 1870","After 1878","After 1920"],a:"E",r:"Kalimat terakhir: RUU hak pilih perempuan “continually failed to pass until 1920, when the Nineteenth Amendment granted women the right to vote.” 1865 akhir Perang Saudara; 1868 dan 1870 hak pilih untuk kulit hitam; 1869 hanya Wyoming; 1878 saat RUU pertama diajukan."},
{g:"Teks 15–19 · Women’s suffrage",t:"single",q:"What is mainly discussed in the second paragraph?",o:["The process of giving right to vote to women.","The effects of the civil war.","The right to vote to black people.","The nineteenth amendment.","The Wyoming Territory."],a:"A",r:"Paragraf 2 menceritakan urutan perjuangan: setelah 1865 hak pilih diberikan ke kulit hitam, feminis menuntut hak yang sama, Wyoming mengalah (1869), RUU diajukan sejak 1878, sampai disahkan 1920. Jadi tema utamanya adalah PROSES pemberian hak pilih bagi perempuan. B–E hanyalah bagian-bagian detail."},
{g:"Teks 15–19 · Women’s suffrage",t:"single",q:"What is the topic of the passage primarily concerned with?",o:["Abolitionists","The civil war","Women’s suffrage","The Wyoming Territory","The Fourteenth and Fifteenth Amendment"],a:"C",r:"Seluruh teks bergerak dari gerakan reformasi, ke abolisionisme sebagai pintu masuk perempuan ke politik, hingga perjuangan dan keberhasilan hak pilih perempuan tahun 1920. Abolitionists, civil war, Wyoming, dan amandemen hanyalah latar atau detail."},
{g:"Teks 15–19 · Women’s suffrage",t:"single",q:"According to the passage, why did women become active in politics?",o:["To be elected to public office","To be famous throughout the world","To amend the Declaration of Independence","To support Elizabeth Cady Stanton for president","To improve the condition of life that existed at the time bill had been presented to"],a:"E",r:"Kalimat tegas di paragraf 1: “They became involved primarily in order to better their living conditions and the conditions of others.” Itu sama dengan E (memperbaiki kondisi hidup). Pilihan lain tidak disebut dalam teks."},
{g:"Teks 15–19 · Women’s suffrage",t:"single",q:"“A women’s suffrage bill had been presented to ...” (paragraph 2). The closest meaning to the underlined word is ...",o:["freedom from slavery","the right to vote","citizenship","expectation","pain"],a:"B",r:"Konteks: “granted citizenship and suffrage to blacks but not to women” lalu “demand the right to vote”. Suffrage = hak pilih = the right to vote. Citizenship (kewarganegaraan) disebut terpisah di kalimat yang sama, jadi bukan sinonim."},
{g:"Menyusun kalimat acak",t:"single",q:"The following sentences are jumbled. 1. One is familiar “Tombstone” mat lists where you went to school and where you’ve worked in chronological order. 2. But prospective employees throw away most of those unrequested “Tombstone” lists, preferring to interview the quick rather than the dead. 3. The main purpose of a resume is to convince an employer to grant you an interview. 4. It’s handy to have a “Tombstone” for certain occasions. 5. There are two kinds. 6. The other is what I call the “functional” resume descriptive, fun to read, unique to you and much more likely to land you an interview. The correct arrangement of the sentences above is:",o:["1, 2, 3, 4, 5, 6","1, 3, 5, 2, 4, 6","2, 4, 6, 1, 3, 5","6, 1, 4, 3, 2, 5","3, 5, 1, 6, 4, 2"],a:"E",r:"Susun dari ide umum ke rinci. 3 = gagasan umum (tujuan resume). 5 “There are two kinds” = pengantar jenis. 1 “One is …” = jenis pertama (Tombstone). 6 “The other is …” = jenis kedua (functional). 4 = catatan bahwa Tombstone tetap berguna, lalu 2 “But …” = kontras bahwa pelamar tetap membuangnya. Pasangan penanda “One … The other” dan kata “But” menjaga urutan. Hanya E yang diawali 3, 5, 1."},
{g:"Fill in the blanks",t:"single",q:"Poverty sometimes occurs in ...(21) slums, where some poor people have not had the opportunity to learn skills that will help them to ...(22) a living. People trapped in this kind of situation often have ...(23) income.  —  Soal 21: isi titik (21).",o:["rich","small","urban","remote","suburban"],a:"C",r:"Slums (permukiman kumuh) lazimnya berada di kota, jadi urban slums. Rich bertentangan dengan poverty; remote dan small tidak lazim dipasangkan dengan slums; suburban (pinggiran kota) kurang tepat dibanding urban."},
{g:"Fill in the blanks",t:"single",q:"Soal 22: “… skills that will help them to ...(22) a living.”",o:["get","owe","find","need","earn"],a:"E",r:"Kolokasi baku: earn a living (mencari nafkah). Get a living, find a living, dan owe a living tidak lazim dalam bahasa Inggris."},
{g:"Fill in the blanks",t:"single",q:"Soal 23: “People trapped in this kind of situation often have ...(23) income.”",o:["much","enough","sufficient","inefficient","inadequate"],a:"E",r:"Konteksnya kemiskinan, jadi penghasilan yang dimaksud kurang: inadequate income. Much, enough, dan sufficient bermakna cukup/banyak (bertentangan). Inefficient dipakai untuk proses atau mesin, bukan income."},
{g:"Teks 24–25 · Surat Rayani",t:"single",q:"What teacher is Ms. Susanti?",o:["Biology","Geography","Mathematics","History","Pancasila"],a:"C",r:"Rayani menulis kepada Ms. Susanti tentang “the upcoming math exam” dan meminta bantuan belajar matematika. Jadi Ms. Susanti adalah guru Mathematics."},
{g:"Teks 24–25 · Surat Rayani",t:"single",q:"What does Rayani think of mathematics?",o:["It’s easy","It’s not easy","It’s helpful","It’s enjoyable","It’s not difficult"],a:"B",r:"Rayani menulis: “math has always been a challenging subject for me”. Challenging = menantang/sulit, jadi dia menganggapnya not easy. E (not difficult) berlawanan makna; C dan D tidak disebut."}
];
const R=["The text does not name any industry, so we think about it. The text says AI is good with data. A is TRUE: information and communication work uses a lot of data. B is TRUE: banks and insurance companies use data to make plans. C is FALSE: farming, forests and fishing need hands-on work. The text does not say AI does this work.","Look for words about nature. A is nature: green forests, mangrove swamps, coral reefs. C is nature: a waterfall, a clear pool, mist. D is nature: mist and sunlight on the rice fields. B is not nature: farmers made the terraces by hand. E is about farmers at work, not about nature.","Find proof in the text. A: the writer ran to get the first aid kit and helped the coach. C: the writer came on time, followed instructions and learned new things. D: the coaches said the writer was good at teamwork and communication. B is wrong: the writer worked with a team. E is wrong: the text does not say the writer was creative.","Look for the words “every morning”. The text says: “Every morning I had to wake up early, arrive on time, and follow instructions carefully.” So D is right. E is wrong: the cones and the water were for the first day, not every morning.","The text says carbon comes from the air (the atmosphere). The other things come from the soil. So the answer is carbon.","The text says most nutrients are “bound tightly”. This means plants cannot use them fast. So farmers only look at the nutrients that plants can use. D is right.","Topic means the main thing in the paragraph. The last sentence says the farmer wants to measure the available nutrients. So D is right. The other answers are only small parts.","The text names five things that are not important: sodium, iodine, cobalt, silicon and aluminum. Count them: 1, 2, 3, 4, 5. The answer is five.","Obtain means get. “The plant obtains carbon” is the same as “The plant gets carbon”. Give is the opposite. Have is not about getting something.","The first sentence says: “the polar region, around the North Pole”. So the answer is the North Pole. “Arctic seas” is in paragraph 2 and it is about fish, so it is not the best answer.","The whole text talks about ecology. It says what ecology is and gives examples. Polar bears, cycles and pesticides are only examples. The last line says: “Through ecology …”.","The text says people can break the balance: “where man interferes … the balance is destroyed”. So D is right. Pesticides are only one example.","The main idea is often in the first sentence. Paragraph 3 starts with this idea: plants and animals need each other. The nitrogen cycle and the oxygen cycle are examples. So C is right.","Devastation means very big damage. Destruction means the same thing. Preservation and rehabilitation are good things, so they are the opposite.","The last sentence says: in 1920, the Nineteenth Amendment gave women the right to vote. So the answer is “After 1920”. Wyoming in 1869 was only one place.","Paragraph 2 tells the steps. Black men get the vote. Women ask for the same right. Wyoming says yes. A bill goes to Congress many times. Then, in 1920, women get the vote. So the paragraph is about the process.","The whole text moves to one big idea: women get the right to vote. Abolitionists and the Civil War are only background.","The text says women joined politics “to better their living conditions and the conditions of others”. That is E.","Suffrage means the right to vote. The text says “suffrage to blacks” and later “the right to vote”. They mean the same thing.","Put the sentences in order. 3 gives the main idea. 5 says there are two kinds. 1 says “One is …”. 6 says “The other is …”. 4 says the first kind is useful sometimes. 2 starts with “But” and shows a problem. So the order is 3, 5, 1, 6, 4, 2.","Slums are usually in cities. So “urban slums” is right. Rich is the opposite of poverty.","We say “earn a living”. It means to get money from work. The other words do not go with “a living”.","The topic is poverty, so the money is not enough. “Inadequate” means not enough. Enough and sufficient mean it is OK, so they are wrong.","Rayani writes about “the upcoming math exam”. So Ms. Susanti is the math teacher.","Rayani says math is “a challenging subject”. Challenging means hard. So math is not easy. “Not difficult” is the opposite."];Q.forEach((q,k)=>q.r=R[k]);
const E=[["“AI can analyze vast amounts of data quickly, identifying patterns and trends that help managers make informed, data-driven decisions.”","“This leads to more accurate forecasts, improved employee engagement, and better overall results.”"],["A: “a peaceful area filled with green forests, calm mangrove swamps, and colorful coral reefs along the sea.”","C: “Water flows gently over rocky cliffs into a cool, clear pool. Mist rises into the air, mixing with the calming sound of falling water.”","D: “In the morning, mist rises above the fields, and sunlight reflects off the water in the paddies.”","Not B: “These terraces are shaped by generations of farmers who work the land by hand.” (made by people)"],["A: “I quickly ran to get the first aid kit. I helped the coach assess the injury”","C: “Every morning I had to wake up early, arrive on time, and follow instructions carefully.”","D: “They highlighted my strengths in teamwork, responsibility, and communication”"],["“Every morning I had to wake up early, arrive on time, and follow instructions carefully.”"],["“The plant obtains carbon and hydrogen dioxide from the atmosphere; other nutrients are taken up from the soil.”"],["“Much of this potential supply, however, is bound tightly in forms that are not released to crops fast enough to give satisfactory growth.”"],["“Because of this, the farmer is interested in measuring the available nutrient supply as contrasted to the total quantities.”"],["“Although the plant contains sodium, iodine, and cobalt, these are apparently not essential. This is also true of silicon and aluminum.”"],["“The plant obtains carbon and hydrogen dioxide from the atmosphere” (the plant gets it from the air)"],["“Polar bear are adapted to life in the polar region, around the North Pole.”"],["“The science that studies the way that different forms of life are adapted to their particular environment is called ecology.”","“Through ecology we try to restore the balance in the ecological system”"],["“However, particularly where man interferes, a species may become too successful and abundant, and the balance is destroyed.”"],["“There are certain important cycles in nature that show plants and animals depend on each other”"],["“Through ecology we try to restore the balance in the ecological system, and thus save the world from devastation.” (save the world from big damage)"],["“A women's suffrage bill had been presented to every Congress since 1878 but it continually failed to pass until 1920, when the Nineteenth Amendment granted women the right to vote.”"],["“Wyoming Territory had yielded to demands by feminists, but eastern states resisted more stubbornly than before.”","“A women's suffrage bill had been presented to every Congress since 1878 but it continually failed to pass until 1920”"],["“Probably more than any other movement, abolitionism offered women previously denied entry into politics.”","“until 1920, when the Nineteenth Amendment granted women the right to vote.”"],["“They became involved primarily in order to better their living conditions and the conditions of others.”"],["“granted citizenship and suffrage to blacks but not to women.”","“feminists influenced more and more women to demand the right to vote.”"],["3 → “The main purpose of a resume is to convince an employer to grant you an interview.”","5 → “There are two kinds.”","1 → “One is familiar ‘Tombstone’ …”   6 → “The other is what I call the ‘functional’ resume …”","4 → “It's handy to have a ‘Tombstone’ for certain occasions.”   2 → “But prospective employees throw away most of those … lists”"],["“Poverty sometimes occurs in … slums, where some poor people have not had the opportunity to learn skills”"],["“skills that will help them to … a living”"],["“People trapped in this kind of situation often have … income.” (poverty = not enough money)"],["“I am writing to you today to express my concerns about the upcoming math exam.”"],["“math has always been a challenging subject for me, and I have been struggling with it for some time now.”"]];
Q.forEach((q,k)=>q.e=E[k]);
const N=Q.length,L="ABCDE";
const S=Q.map(()=>({sel:new Set(),tf:[],done:false,ok:false}));
let i=0;
const $=id=>document.getElementById(id);
const disp=(q)=>q.t==="tf"?q.a.split("").map(c=>c==="T"?"B":"S").join(", "):q.a.split("").join(", ");
function go(n){i=Math.max(0,Math.min(N+1,n));render();window.scrollTo(0,0)}
function pick(k){const s=S[i-1];if(s.done)return;if(Q[i-1].t==="multi"){s.sel.has(k)?s.sel.delete(k):s.sel.add(k)}else{s.sel=new Set([k])}render()}
function tf(k,v){const s=S[i-1];if(s.done)return;s.tf[k]=v;render()}
function check(){const s=S[i-1],q=Q[i-1];s.ok=q.t==="tf"?q.o.every((_,k)=>s.tf[k]===q.a[k]):[...s.sel].sort().join("")===q.a;s.done=true;render()}
function again(){S.forEach(s=>{s.sel=new Set();s.tf=[];s.done=false;s.ok=false});go(0)}
function render(){
  $("pb").style.width=(i/(N+1)*100)+"%";
  $("pv").disabled=i===0;$("nx").disabled=i===N+1;
  const el=$("s");
  if(i===0){
    el.innerHTML=`<div class="tag">Slide interaktif · Rumah Prestasi</div><h1>Tryout TKA 3 – Bahasa Inggris</h1><p>25 soal dengan pembahasan lengkap. Pilih jawabanmu, tekan <b>Cek Jawaban</b>, lalu baca alasannya langkah demi langkah. Gunakan tombol ← → di keyboard untuk berpindah slide.</p><p class="hint">Soal 1 berbentuk Benar/Salah, soal 2 dan 3 boleh lebih dari satu jawaban. Soal lainnya satu jawaban.</p><button class="btn" onclick="go(1)">Mulai latihan →</button>`;return}
  if(i===N+1){
    const d=S.filter(s=>s.done).length,c=S.filter(s=>s.ok).length;
    el.innerHTML=`<div class="tag">Rekap</div><h1>Kunci &amp; skor</h1><p>Terjawab: <b>${d}/${N}</b> · Benar: <b>${c}</b>${d?` · Nilai: <b>${Math.round(c/N*100)}</b>`:""}</p><p class="hint">Klik kotak mana pun untuk membuka kembali pembahasannya.</p><div class="grid">${Q.map((q,k)=>`<button class="chip ${S[k].done?(S[k].ok?"ok":"no"):""}" onclick="go(${k+1})"><b>${k+1}</b> ${disp(q)}<small>${S[k].done?(S[k].ok?"benar":"perlu ulang"):"belum dijawab"}</small></button>`).join("")}</div><p style="margin-top:16px"><button class="btn g" onclick="again()">Ulangi dari awal</button></p>`;return}
  const q=Q[i-1],s=S[i-1];let h=`<div class="tag">Soal ${i} dari ${N} · ${q.g}</div><h2>${q.q}</h2>`;
  if(q.t==="multi")h+=`<div class="hint">Ada lebih dari satu jawaban benar. Pilih semuanya.</div>`;
  if(q.t==="tf"){
    h+=q.o.map((o,k)=>{const v=s.tf[k],c=q.a[k];const cl=x=>s.done?(x===c?"ok":(v===x?"no":"")):(v===x?"sel":"");
      return `<div class="tfrow"><b>${L[k]}.</b> ${o}<div class="b"><button class="pill ${cl("T")}" onclick="tf(${k},'T')" ${s.done?"disabled":""}>Benar</button><button class="pill ${cl("F")}" onclick="tf(${k},'F')" ${s.done?"disabled":""}>Salah</button></div></div>`}).join("");
  }else{
    h+=q.o.map((o,k)=>{const l=L[k],right=q.a.includes(l),on=s.sel.has(l);
      const cl=s.done?(right?"ok":(on?"no":"")):(on?"sel":"");
      return `<button class="opt ${cl}" onclick="pick('${l}')" ${s.done?"disabled":""}><b>${l}.</b><span>${o}</span></button>`}).join("");
  }
  const ready=q.t==="tf"?q.o.every((_,k)=>s.tf[k]):s.sel.size>0;
  if(!s.done)h+=`<button class="btn" onclick="check()" ${ready?"":"disabled"}>Cek Jawaban</button>`;
  else h+=`<div class="fb ${s.ok?"good":"bad"}"><div class="v">${s.ok?"Benar! ✓":"Belum tepat."} Kunci: ${disp(q)}</div>${q.r}</div><div class="ev"><div class="t">Evidence from the text</div>${q.e.map(x=>`<p>${x}</p>`).join("")}</div>`;
  el.innerHTML=h;
}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1)});
render();
</script>
